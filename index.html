<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | CasualtiesUnknown</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <style>
      #game-loading-screen {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
        padding: 24px; box-sizing: border-box; color: #e9edf0;
        background: radial-gradient(ellipse at 50% 38%, #203744 0%, #111d25 48%, #080c10 100%);
        font-family: Arial, Helvetica, sans-serif; transition: opacity 700ms ease;
      }
      #game-loading-screen.is-ready { opacity: 0; pointer-events: none; }
      .game-loading-card { width: min(440px, 100%); text-align: center; }
      .game-loading-mark {
        width: 54px; height: 54px; margin: 0 auto 28px; border: 2px solid #49606a;
        border-right-color: #e7a653; border-bottom-color: #e7a653; border-radius: 50%;
        animation: game-loading-spin 1.15s linear infinite;
      }
      .game-loading-title { margin: 0; color: #f3f0e8; font-size: clamp(22px, 5vw, 32px); letter-spacing: .16em; }
      .game-loading-subtitle { margin: 14px 0 30px; color: #c2cbd0; font-size: 15px; }
      .game-loading-track { height: 5px; overflow: hidden; background: #34444c; }
      .game-loading-progress {
        width: 2%; height: 100%; background: #e7a653; transition: width 250ms ease;
        box-shadow: 0 0 14px #e7a65388;
      }
      #game-loading-screen.is-building .game-loading-progress { animation: game-loading-pulse 1.4s ease-in-out infinite alternate; }
      .game-loading-note { min-height: 20px; margin-top: 14px; color: #94a5ad; font-size: 12px; }
      .game-loading-continue {
        display: none; margin: 18px auto 0; padding: 11px 22px; border: 0;
        background: #e7a653; color: #111820; font-size: 14px; font-weight: 700;
        cursor: pointer;
      }
      .game-loading-continue.is-visible { display: inline-flex; }
      .game-loading-continue:focus-visible { outline: 2px solid #f3f0e8; outline-offset: 3px; }
      @keyframes game-loading-spin { to { transform: rotate(360deg); } }
      @keyframes game-loading-pulse { from { opacity: .55; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .game-loading-mark { animation-duration: 4s; }
        #game-loading-screen, .game-loading-progress { transition-duration: 0ms; }
      }
    </style>
  </head>
  <body>
    <div id='game-loading-screen' role='status' aria-live='polite'>
      <div class='game-loading-card'>
        <div class='game-loading-mark' aria-hidden='true'></div>
        <h1 class='game-loading-title'>CASUALTIES UNKNOWN</h1>
        <p id='game-loading-status' class='game-loading-subtitle'>Preparing your game...</p>
        <div class='game-loading-track' aria-hidden='true'><div id='game-loading-progress' class='game-loading-progress'></div></div>
        <p id='game-loading-note' class='game-loading-note'>The first load can take a little while.</p>
        <button id='game-loading-continue' class='game-loading-continue' type='button'>Continue to game</button>
      </div>
    </div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">CasualtiesUnknown</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var gameLoadingScreen = document.querySelector("#game-loading-screen");
      var gameLoadingStatus = document.querySelector("#game-loading-status");
      var gameLoadingNote = document.querySelector("#game-loading-note");
      var gameLoadingProgress = document.querySelector("#game-loading-progress");
      var gameLoadingContinue = document.querySelector("#game-loading-continue");
      var gameLoadingFallbackTimer;
      function hideGameLoadingScreen() {
        window.clearTimeout(gameLoadingFallbackTimer);
        gameLoadingStatus.textContent = "World ready";
        gameLoadingNote.textContent = "Entering the game...";
        gameLoadingProgress.style.width = "100%";
        gameLoadingContinue.classList.remove("is-visible");
        gameLoadingScreen.classList.remove("is-building");
        gameLoadingScreen.classList.add("is-ready");
        window.setTimeout(function() { gameLoadingScreen.style.display = "none"; }, 750);
      }
      gameLoadingContinue.addEventListener("click", hideGameLoadingScreen);
      window.UnityWorldReady = hideGameLoadingScreen;

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL.data.br",
        frameworkUrl: buildUrl + "/WebGL.framework.js.br",
        codeUrl: buildUrl + "/WebGL.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Orsoniks",
        productName: "CasualtiesUnknown",
        productVersion: "5.1",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        document.body.style.overflow = "hidden";
        function resizeUnityCanvas() {
          var footerHeight = 38;
          var scale = Math.min((window.innerWidth - 24) / 960, (window.innerHeight - footerHeight - 24) / 600);
          scale = Math.max(0.1, scale);
          canvas.style.width = Math.floor(960 * scale) + "px";
          canvas.style.height = Math.floor(600 * scale) + "px";
        }
        resizeUnityCanvas();
        window.addEventListener("resize", resizeUnityCanvas);
      }

      if (window.location.protocol === "file:") {
        unityShowBanner(
          'This compressed Unity WebGL build cannot run from a file:// URL. Double-click "Run WebGL Locally.bat" in this folder to start the included local server.',
          "error"
        );
      } else {
        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            gameLoadingProgress.style.width = Math.min(80, 2 + 78 * progress) + "%";
          gameLoadingNote.textContent = "Loading game assets...";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            gameLoadingScreen.classList.add("is-building");
            gameLoadingStatus.textContent = "Generating your world...";
            gameLoadingNote.textContent = "Building the map and placing your character.";
            gameLoadingProgress.style.width = "82%";
            window.setTimeout(function() {
              if (!gameLoadingScreen.classList.contains("is-ready")) {
                gameLoadingStatus.textContent = "The world is taking longer to load.";
                gameLoadingNote.textContent = "You can keep waiting or continue to the game.";
                gameLoadingContinue.classList.add("is-visible");
              }
            }, 15000);
            gameLoadingFallbackTimer = window.setTimeout(function() {
              if (!gameLoadingScreen.classList.contains("is-ready")) hideGameLoadingScreen();
            }, 60000);
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }).catch((message) => {
            gameLoadingStatus.textContent = "The game could not start.";
        gameLoadingNote.textContent = message;
        gameLoadingProgress.style.background = "#d45b58";
          });
        };

        document.body.appendChild(script);
      }

    </script>
  </body>
</html>
